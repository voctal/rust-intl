# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.2"
categories = ["localization"]
keywords = ["i18n", "icu", "intl", "localization", "translations"]
license = "MIT"
repository = "https://github.com/voctal/rust-intl"
description = "A Rust internationalization library"
edition = "2024"

[workspace.dependencies]
rust_intl = { path = "./crates/rust_intl", version = "0.2.2" }
rust_intl_macros = { path = "./crates/rust_intl_macros", version = "0.2.2" }
