name: Publish to Crates.io

on:
    release:
        types: [published]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    publish:
        name: Publish Crates
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Verify version matches release tag
              run: |
                  TAG=${GITHUB_REF_NAME}
                  cargo metadata --no-deps --format-version 1 > meta.json

                  # SAFETY FIX: Explicitly grab the version of the main crate
                  VERSION=$(jq -r '.packages[] | select(.name == "rust_intl") | .version' meta.json)

                  echo "Tag: $TAG"
                  echo "Version: v$VERSION"

                  if [ "$TAG" != "v$VERSION" ]; then
                    echo "Version mismatch between tag and Cargo.toml"
                    exit 1
                  fi

            - name: Install Rust Toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Run tests
              run: cargo test --workspace --all-features

            - name: Build
              run: cargo build --workspace --all-features

            - name: Publish Workspace Crates
              uses: katyo/publish-crates@v2
              with:
                  registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
